name: Test

on:
  pull_request:
  push:
    branches: [master]

# Cancela execuções antigas do mesmo branch/PR (economiza minutos de CI).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit + integração (Vitest) ───────────────────────────────────────────
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Versão do pnpm vem do campo "packageManager" do package.json (corepack/parity).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests with coverage
        run: pnpm test:coverage

  # ── E2E (Playwright) ─────────────────────────────────────────────────────
  # Sobe um Postgres efêmero, migra + seeda, e roda os fluxos contra o app.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: belessence
          POSTGRES_PASSWORD: belessence
          POSTGRES_DB: belessence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U belessence -d belessence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://belessence:belessence@localhost:5432/belessence_test
      # >=16 chars: o schema de env valida o tamanho, porque ADMIN_SECRET e
      # chave de assinatura HS256, nao um identificador. Valor curto aqui
      # derrubava o boot e, com ele, o e2e inteiro.
      ADMIN_SECRET: e2e-admin-secret-fixo-para-ci
      # Mesmo segredo lido pelo app (Auth.js) e pelo loginAsUser (forja o JWT).
      AUTH_SECRET: e2e-auth-secret-fixo-para-ci
      # Valores de fachada, não credenciais: o CloudinaryUpload esconde o
      # widget inteiro quando cloudName/apiKey faltam (`missingConfig`), e aí
      # o admin-crud não tem como anexar imagem e o form nunca envia. O upload
      # de verdade nunca acontece — `stubCloudinaryWidget` dubla o script.
      # Precisam existir no BUILD: NEXT_PUBLIC_* é inlinado no bundle.
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: demo
      NEXT_PUBLIC_CLOUDINARY_API_KEY: "000000000000000"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5

      # Versão do pnpm vem do campo "packageManager" do package.json (corepack/parity).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations + seed
        run: |
          pnpm prisma migrate deploy
          pnpm prisma db seed

      - name: Install Playwright system deps
        run: pnpm exec playwright install-deps chromium

      # O download dos browsers na CDN da Playwright às vezes estanca sem timeout
      # próprio (já travou um run por ~35min). Aborta cada tentativa em 4min e
      # tenta de novo (até 3x) — self-heal de flake de rede.
      - name: Install Playwright browser (chromium, com retry)
        run: |
          n=0
          until [ "$n" -ge 3 ]; do
            timeout 240 pnpm exec playwright install chromium && exit 0
            n=$((n + 1))
            echo "Tentativa $n de baixar o chromium falhou/travou; retry em 5s..."
            sleep 5
          done
          echo "playwright install chromium falhou após 3 tentativas"; exit 1

      - name: Run E2E
        run: pnpm test:e2e --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
